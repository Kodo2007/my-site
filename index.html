<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Market v5</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1220;
  color: white;
}

header {
  padding: 18px;
  text-align: center;
  background: #111a2e;
  font-size: 20px;
  font-weight: bold;
}

/* СТРАНИЦЫ */
.page {
  display: none;
  padding: 15px;
}

.active {
  display: block;
}

/* КАТАЛОГ */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
}

.card {
  background: #151f36;
  border-radius: 12px;
  padding: 10px;
  cursor: pointer;
}

/* ТОВАР */
.product {
  background: #151f36;
  padding: 15px;
  border-radius: 12px;
}

button {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: #6366f1;
  color: white;
  cursor: pointer;
  margin-top: 10px;
}

.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
}

.nav button {
  border-radius: 0;
  margin: 0;
}
</style>
</head>

<body>

<header>🛍 Market v5</header>

<!-- КАТАЛОГ -->
<div id="catalog" class="page active"></div>

<!-- ТОВАР -->
<div id="productPage" class="page"></div>

<!-- КОРЗИНА -->
<div id="cartPage" class="page"></div>

<!-- НАВИГАЦИЯ -->
<div class="nav">
  <button onclick="show('catalog')">Каталог</button>
  <button onclick="show('cartPage')">Корзина</button>
</div>

<script>

const products = [
  { id:1, name:"Футболка", price:5000, desc:"Хлопок 100%" },
  { id:2, name:"Кроссовки", price:15000, desc:"Беговые" },
  { id:3, name:"Кепка", price:3000, desc:"Летняя" }
];

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let currentProduct = null;

function save(){
  localStorage.setItem("cart", JSON.stringify(cart));
}

/* НАВИГАЦИЯ */
function show(page){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(page).classList.add("active");

  if(page === "catalog") renderCatalog();
  if(page === "cartPage") renderCart();
}

/* КАТАЛОГ */
function renderCatalog(){
  let el = document.getElementById("catalog");
  el.innerHTML = `<div class="grid">
    ${products.map(p => `
      <div class="card" onclick="openProduct(${p.id})">
        <h4>${p.name}</h4>
        <div>${p.price}₸</div>
      </div>
    `).join("")}
  </div>`;
}

/* ТОВАР */
function openProduct(id){
  currentProduct = products.find(p => p.id === id);

  let el = document.getElementById("productPage");

  el.innerHTML = `
    <div class="product">
      <h2>${currentProduct.name}</h2>
      <p>${currentProduct.desc}</p>
      <b>${currentProduct.price}₸</b>

      <button onclick="addToCart()">
        В корзину
      </button>

      <button onclick="show('catalog')">
        Назад
      </button>
    </div>
  `;

  show("productPage");
}

/* КОРЗИНА */
function renderCart(){
  let el = document.getElementById("cartPage");

  let sum = cart.reduce((a,b)=>a+b.price,0);

  el.innerHTML = `
    <h3>Корзина</h3>

    ${cart.map((c,i)=>`
      <div class="card">
        ${c.name} - ${c.price}₸
        <button onclick="remove(${i})">Удалить</button>
      </div>
    `).join("")}

    <h3>Итого: ${sum}₸</h3>
  `;
}

/* ЛОГИКА */
function addToCart(){
  cart.push(currentProduct);
  save();
  alert("Добавлено в корзину");
}

function remove(i){
  cart.splice(i,1);
  save();
  renderCart();
}

renderCatalog();

</script>

</body>
</html>
