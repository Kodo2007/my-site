<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Senet.CCD1</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

header{
  padding:20px;
  text-align:center;
  background:#111a2e;
  font-size:22px;
  font-weight:bold;
}

.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}

.card{
  background:#151f36;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#6d28d9;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<header>Senet.CCD1</header>

<div class="container">

  <div class="card">
    <h3>🔐 Login / Register</h3>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>

    <p id="status"></p>
  </div>

  <div class="card" id="userCard" style="display:none;">
    <h3>👤 User</h3>
    <p id="userEmail"></p>
    <button onclick="logout()">Logout</button>
  </div>

</div>

<!-- Firebase SDK (ВАЖНО: это должно быть внизу) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
// 🔥 ВСТАВЬ СЮДА СВОЙ CONFIG ИЗ FIREBASE
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "senet-ccd1.firebaseapp.com",
  projectId: "senet-ccd1",
  storageBucket: "senet-ccd1.appspot.com",
  messagingSenderId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

/* REGISTER */
function register(){
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, password)
  .then(user=>{
    document.getElementById("status").innerText = "Аккаунт создан";
  })
  .catch(e=>{
    document.getElementById("status").innerText = e.message;
  });
}

/* LOGIN */
function login(){
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
  .then(user=>{
    document.getElementById("status").innerText = "Вход выполнен";

    document.getElementById("userCard").style.display = "block";
    document.getElementById("userEmail").innerText = user.user.email;
  })
  .catch(e=>{
    document.getElementById("status").innerText = e.message;
  });
}

/* LOGOUT */
function logout(){
  auth.signOut();
  document.getElementById("userCard").style.display = "none";
}
</script>

</body>
</html>
