<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SenetCCD Market</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

header{
  padding:20px;
  text-align:center;
  background:#111a2e;
  font-size:22px;
  font-weight:bold;
}

.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.card{
  background:#151f36;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#6d28d9;
  color:white;
  cursor:pointer;
}

.product{
  padding:10px;
  border-bottom:1px solid #333;
}
</style>
</head>

<body>

<header>SenetCCD Market</header>

<div class="container">

  <div class="card">
    <h3>🔐 Login</h3>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>

    <p id="status"></p>
  </div>

  <div class="card">
    <h3>🛒 Products</h3>
    <div id="products"></div>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
// 🔥 CONFIG (твой)
const firebaseConfig = {
  apiKey: "AIzaSyB4ve7DRWKeRjSH-ivXM4MEOcnjkjXHBOg",
  authDomain: "senet-ccd1.firebaseapp.com",
  projectId: "senet-ccd1",
  storageBucket: "senet-ccd1.firebasestorage.app",
  messagingSenderId: "762088815919",
  appId: "1:762088815919:web:43c6a833309b2b871635da",
  measurementId: "G-ETWSDRP530"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* AUTH */
function register(){
  let email = emailInput().email;
}

function emailInput(){
  return {
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  }
}

auth.createUserWithEmailAndPassword = function(email, password){};

function register(){
  let {email, password} = emailInput();

  auth.createUserWithEmailAndPassword(email, password)
  .then(()=>{
    document.getElementById("status").innerText = "Registered";
  })
  .catch(e=>{
    document.getElementById("status").innerText = e.message;
  });
}

function login(){
  let {email, password} = emailInput();

  auth.signInWithEmailAndPassword(email, password)
  .then(()=>{
    document.getElementById("status").innerText = "Logged in";
  })
  .catch(e=>{
    document.getElementById("status").innerText = e.message;
  });
}

/* PRODUCTS */
function loadProducts(){
  db.collection("products").onSnapshot(snapshot=>{
    let html = "";

    snapshot.forEach(doc=>{
      let p = doc.data();

      html += `
        <div class="product">
          <h4>${p.name}</h4>
          <p>${p.description}</p>
          <b>${p.price} ₸</b>
        </div>
      `;
    });

    document.getElementById("products").innerHTML = html;
  });
}

loadProducts();
</script>

</body>
</html>
