<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SenetCCD</title>

<style>
body{
  font-family: Arial;
  background:#0b1220;
  color:white;
  margin:0;
}

.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}

.card{
  background:#151f36;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#6d28d9;
  color:white;
  cursor:pointer;
}

.product{
  padding:10px;
  border-bottom:1px solid #333;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h2>SenetCCD Auth</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>
    <button onclick="logout()">Logout</button>

    <p id="status">Not logged in</p>
    <p id="userInfo"></p>
  </div>

  <div class="card">
    <h2>Products</h2>
    <div id="products"></div>
  </div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
// 🔥 Firebase Config (твой)
const firebaseConfig = {
  apiKey: "AIzaSyB4ve7DRWKeRjSH-ivXM4MEOcnjkjXHBOg",
  authDomain: "senet-ccd1.firebaseapp.com",
  projectId: "senet-ccd1",
  storageBucket: "senet-ccd1.firebasestorage.app",
  messagingSenderId: "762088815919",
  appId: "1:762088815919:web:43c6a833309b2b871635da",
  measurementId: "G-ETWSDRP530"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* ================= AUTH ================= */

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById("status").innerText = "Logged in";
    document.getElementById("userInfo").innerText = "👤 " + user.email;
  } else {
    document.getElementById("status").innerText = "Not logged in";
    document.getElementById("userInfo").innerText = "";
  }
});

function register(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, password)
    .catch(e => alert(e.message));
}

function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .catch(e => alert(e.message));
}

function logout(){
  auth.signOut();
}

/* ================= PRODUCTS ================= */

function loadProducts(){
  db.collection("products").onSnapshot(snapshot=>{
    let html = "";

    snapshot.forEach(doc=>{
      let p = doc.data();

      html += `
        <div class="product">
          <h4>${p.name || "No name"}</h4>
          <p>${p.description || ""}</p>
          <b>${p.price || 0} ₸</b>
        </div>
      `;
    });

    document.getElementById("products").innerHTML = html;
  });
}

loadProducts();

</script>

</body>
</html>
