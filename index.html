<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Senet.CCD Text Tools</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

header{
  padding:20px;
  text-align:center;
  background:#111a2e;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:#151f36;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}

textarea{
  width:100%;
  height:120px;
  border-radius:10px;
  border:none;
  padding:10px;
}

button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:10px;
  background:#6d28d9;
  color:white;
}

.pro{
  border:1px solid #6d28d9;
}
</style>
</head>

<body>

<header>Senet.CCD — Text Tools Pack</header>

<div class="container">

  <!-- FREE TOOL -->
  <div class="card">
    <h3>Text Formatter (FREE)</h3>
    <textarea id="text"></textarea>

    <button onclick="upper()">UPPERCASE</button>
    <button onclick="lower()">lowercase</button>
    <button onclick="count()">Word Count</button>

    <p id="result"></p>
  </div>

  <!-- PRO SECTION -->
  <div class="card pro">
    <h3>🔓 PRO Tools</h3>
    <p>Разблокируются после покупки</p>

    <button onclick="buy()">Купить PRO (990₸)</button>
  </div>

  <div id="proTools" class="card" style="display:none;">
    <h3>Paraphraser (PRO)</h3>
    <button onclick="fakeRewrite()">Перефразировать</button>

    <h3>Summarizer (PRO)</h3>
    <button onclick="fakeSummary()">Сжать текст</button>
  </div>

</div>

<script>

function getText(){
  return document.getElementById("text").value;
}

/* FREE */
function upper(){
  document.getElementById("text").value = getText().toUpperCase();
}

function lower(){
  document.getElementById("text").value = getText().toLowerCase();
}

function count(){
  let words = getText().trim().split(/\s+/).filter(Boolean).length;
  document.getElementById("result").innerText = "Words: " + words;
}

/* BUY */
function buy(){
  alert("Оплата: Kaspi 990₸ → после оплаты включится PRO");
  localStorage.setItem("pro","true");
  document.getElementById("proTools").style.display="block";
}

/* PRO (симуляция) */
function fakeRewrite(){
  let t = getText();
  document.getElementById("text").value = "✨ " + t.split(" ").reverse().join(" ");
}

function fakeSummary(){
  let t = getText();
  document.getElementById("text").value = t.split(" ").slice(0,5).join(" ") + "...";
}

/* AUTO UNLOCK */
if(localStorage.getItem("pro")==="true"){
  document.getElementById("proTools").style.display="block";
}

</script>

</body>
</html>
