<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SenetCCD</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#060816;
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

.bg{
  position:fixed;
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at top left,#6d28d955,transparent 30%),
    radial-gradient(circle at bottom right,#2563eb44,transparent 30%);
  z-index:-1;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 0;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#8b5cf6;
}

.userbox{
  background:rgba(255,255,255,0.05);
  padding:10px 15px;
  border-radius:12px;
  backdrop-filter:blur(10px);
}

.grid{
  display:grid;
  grid-template-columns:350px 1fr;
  gap:20px;
  margin-top:20px;
}

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;
  padding:20px;
  backdrop-filter:blur(14px);
  box-shadow:0 0 25px rgba(0,0,0,0.3);
}

.card h2{
  margin-bottom:15px;
}

input{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  outline:none;
  border-radius:12px;
  background:rgba(255,255,255,0.08);
  color:white;
}

input::placeholder{
  color:#bbb;
}

button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.02);
  opacity:0.95;
}

.status{
  margin-top:15px;
  color:#aaa;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:15px;
}

.product{
  background:rgba(255,255,255,0.04);
  border-radius:16px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.06);
  transition:0.2s;
}

.product:hover{
  transform:translateY(-4px);
}

.product img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.product-content{
  padding:15px;
}

.product h3{
  margin-bottom:8px;
}

.price{
  color:#8b5cf6;
  font-weight:bold;
  margin-top:10px;
  display:block;
}

.buy-btn{
  margin-top:12px;
  background:linear-gradient(135deg,#059669,#2563eb);
}

@media(max-width:900px){

  .grid{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

  <div class="navbar">
    <div class="logo">SenetCCD</div>

    <div class="userbox">
      <div id="status">Not logged in</div>
      <div id="userInfo"></div>
    </div>
  </div>

  <div class="grid">

    <!-- AUTH -->
    <div class="card">

      <h2>🔐 Authentication</h2>

      <input id="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">

      <button onclick="register()">Register</button>
      <button onclick="login()">Login</button>
      <button onclick="logout()">Logout</button>

    </div>

    <!-- PRODUCTS -->
    <div class="card">

      <h2>🛒 Products</h2>

      <div class="products" id="products"></div>

    </div>

  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyB4ve7DRWKeRjSH-ivXM4MEOcnjkjXHBOg",
  authDomain: "senet-ccd1.firebaseapp.com",
  projectId: "senet-ccd1",
  storageBucket: "senet-ccd1.firebasestorage.app",
  messagingSenderId: "762088815919",
  appId: "1:762088815919:web:43c6a833309b2b871635da",
  measurementId: "G-ETWSDRP530"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* USER STATE */
auth.onAuthStateChanged(user => {

  if(user){

    document.getElementById("status").innerText = "🟢 Logged in";
    document.getElementById("userInfo").innerText = user.email;

  }else{

    document.getElementById("status").innerText = "🔴 Not logged in";
    document.getElementById("userInfo").innerText = "";

  }

});

/* REGISTER */
function register(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email,password)
  .catch(e => alert(e.message));

}

/* LOGIN */
function login(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email,password)
  .catch(e => alert(e.message));

}

/* LOGOUT */
function logout(){

  auth.signOut();

}

/* LOAD PRODUCTS */
function loadProducts(){

  db.collection("products").onSnapshot(snapshot => {

    let html = "";

    snapshot.forEach(doc => {

      let p = doc.data();

      html += `
      
      <div class="product">

        <img src="${p.image || 'https://via.placeholder.com/300'}">

        <div class="product-content">

          <h3>${p.name || 'No Name'}</h3>

          <p>${p.description || ''}</p>

          <span class="price">${p.price || 0} ₸</span>

          <button class="buy-btn">Buy</button>

        </div>

      </div>

      `;

    });

    document.getElementById("products").innerHTML = html;

  });

}

loadProducts();

</script>

</body>
</html>
