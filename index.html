<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Senet.CCD</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

header{
  padding:18px;
  text-align:center;
  background:#111a2e;
  font-size:20px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:#151f36;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}

input, button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:10px;
}

button{
  background:#6d28d9;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<header>Senet.CCD — Login System</header>

<div class="container">

  <div class="card">
    <h3>🔐 Register / Login</h3>

    <input id="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">

    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>

    <p id="status"></p>
  </div>

  <div class="card" id="panel" style="display:none;">
    <h3>👤 User Panel</h3>
    <p id="user"></p>
    <button onclick="logout()">Logout</button>
  </div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "PASTE_YOUR_KEY",
  authDomain: "senetccd.firebaseapp.com",
  projectId: "senetccd",
  storageBucket: "senetccd.appspot.com",
  messagingSenderId: "1060046810183",
  appId: "PASTE_YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* REGISTER */
function register(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("pass").value;

  auth.createUserWithEmailAndPassword(email, pass)
  .then(user=>{
    document.getElementById("status").innerText = "Аккаунт создан";
  })
  .catch(e=>{
    document.getElementById("status").innerText = e.message;
  });
}

/* LOGIN */
function login(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("pass").value;

  auth.signInWithEmailAndPassword(email, pass)
  .then(user=>{
    document.getElementById("status").innerText = "Вход выполнен";
    document.getElementById("panel").style.display="block";
    document.getElementById("user").innerText = user.user.email;
  })
  .catch(e=>{
    document.getElementById("status").innerText = e.message;
  });
}

/* LOGOUT */
function logout(){
  auth.signOut();
  document.getElementById("panel").style.display="none";
}
</script>

</body>
</html>
