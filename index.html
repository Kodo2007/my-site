<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Mini Market</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b1220;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111a2e;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: #151f36;
      padding: 15px;
      border-radius: 12px;
    }

    .price {
      color: #22c55e;
      margin: 5px 0 10px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    .cart-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #22c55e;
      padding: 12px 15px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .panel {
      position: fixed;
      right: 0;
      top: 0;
      width: 280px;
      height: 100%;
      background: #0f172a;
      padding: 15px;
      display: none;
      overflow-y: auto;
    }

    .item {
      background: #1e293b;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .remove {
      margin-top: 5px;
      background: red;
      border: none;
      color: white;
      padding: 5px;
      border-radius: 6px;
      cursor: pointer;
    }

    .buy {
      margin-top: 10px;
      background: #22c55e;
    }
  </style>
</head>

<body>

<header>🛒 Mini Market</header>

<div class="container">

  <div class="card">
    <h3>Футболка</h3>
    <div class="price">5000₸</div>
    <button onclick="add('Футболка', 5000)">Купить</button>
  </div>

  <div class="card">
    <h3>Кроссовки</h3>
    <div class="price">15000₸</div>
    <button onclick="add('Кроссовки', 15000)">Купить</button>
  </div>

  <div class="card">
    <h3>Кепка</h3>
    <div class="price">3000₸</div>
    <button onclick="add('Кепка', 3000)">Купить</button>
  </div>

</div>

<div class="cart-btn" onclick="toggle()">
  🛒 Корзина (<span id="count">0</span>)
</div>

<div class="panel" id="panel">
  <h3>Корзина</h3>
  <div id="list"></div>

  <button class="buy" onclick="checkout()">
    Оформить заказ
  </button>
</div>

<script>
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function save() {
    localStorage.setItem("cart", JSON.stringify(cart));
  }

  function render() {
    document.getElementById("count").innerText = cart.length;

    let list = document.getElementById("list");
    list.innerHTML = "";

    cart.forEach((item, index) => {
      let div = document.createElement("div");
      div.className = "item";

      div.innerHTML = `
        ${item.name} - ${item.price}₸
        <button class="remove" onclick="removeItem(${index})">Удалить</button>
      `;

      list.appendChild(div);
    });

    save();
  }

  function add(name, price) {
    cart.push({ name, price });
    render();
  }

  function removeItem(i) {
    cart.splice(i, 1);
    render();
  }

  function toggle() {
    let panel = document.getElementById("panel");
    panel.style.display = panel.style.display === "block" ? "none" : "block";
  }

  function checkout() {
    if (cart.length === 0) {
      alert("Корзина пустая");
      return;
    }

    alert("Заказ оформлен (фейк) 🛒");
    cart = [];
    render();
  }

  render();
</script>

</body>
</html>
