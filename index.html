<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Market Pro v4</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1220;
  color: white;
}

header {
  padding: 18px;
  text-align: center;
  background: #111a2e;
  font-size: 22px;
  font-weight: bold;
}

.top {
  display: flex;
  gap: 10px;
  padding: 10px;
  position: sticky;
  top: 0;
  background: #0b1220;
}

input, select {
  padding: 10px;
  border-radius: 10px;
  border: none;
}

input { flex: 1; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
  padding: 15px;
}

.card {
  background: #151f36;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
}

img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.content {
  padding: 10px;
}

.price {
  color: #22c55e;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 8px;
  border: none;
  border-radius: 10px;
  background: #6366f1;
  color: white;
  cursor: pointer;
}

.heart {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(0,0,0,0.5);
  border: none;
  color: white;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  cursor: pointer;
}

.cart {
  position: fixed;
  bottom: 15px;
  right: 15px;
  background: #22c55e;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
}

.panel {
  position: fixed;
  right: 0;
  top: 0;
  width: 300px;
  height: 100%;
  background: #0f172a;
  padding: 10px;
  display: none;
  overflow-y: auto;
}

.item {
  background: #111a2e;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 10px;
}

small {
  color: #94a3b8;
}
</style>
</head>

<body>

<header>🛍 Market Pro v4</header>

<div class="top">
<input id="search" placeholder="Поиск..." oninput="render()">

<select id="cat" onchange="render()">
  <option value="all">Все</option>
  <option value="clothes">Одежда</option>
  <option value="shoes">Обувь</option>
  <option value="access">Аксессуары</option>
</select>
</div>

<div class="grid" id="grid"></div>

<div class="cart" onclick="toggleCart()">
🛒 <span id="count">0</span> | ❤️ <span id="favCount">0</span>
</div>

<div class="panel" id="panel">
<h3>Корзина</h3>
<div id="list"></div>
</div>

<script>
const products = [
  { name:"Футболка", price:5000, cat:"clothes", img:"https://picsum.photos/200?1" },
  { name:"Худи", price:9000, cat:"clothes", img:"https://picsum.photos/200?2" },
  { name:"Кроссовки", price:15000, cat:"shoes", img:"https://picsum.photos/200?3" },
  { name:"Кепка", price:3000, cat:"access", img:"https://picsum.photos/200?4" }
];

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let fav = JSON.parse(localStorage.getItem("fav")) || [];

function save(){
  localStorage.setItem("cart", JSON.stringify(cart));
  localStorage.setItem("fav", JSON.stringify(fav));
}

function render(){
  let grid = document.getElementById("grid");
  let search = document.getElementById("search").value.toLowerCase();
  let cat = document.getElementById("cat").value;

  grid.innerHTML = "";

  products
  .filter(p =>
    p.name.toLowerCase().includes(search) &&
    (cat === "all" || p.cat === cat)
  )
  .forEach((p,i)=>{

    let isFav = fav.includes(i);

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <button class="heart" onclick="toggleFav(${i})">
        ${isFav ? "❤️" : "🤍"}
      </button>

      <img src="${p.img}">
      <div class="content">
        <h4>${p.name}</h4>
        <small>${p.cat}</small>
        <div class="price">${p.price}₸</div>
        <button onclick="add(${i})">В корзину</button>
      </div>
    `;

    grid.appendChild(div);
  });

  document.getElementById("count").innerText = cart.length;
  document.getElementById("favCount").innerText = fav.length;

  let list = document.getElementById("list");
  list.innerHTML = "";

  cart.forEach((item,i)=>{
    let div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `${item.name} - ${item.price}₸`;
    list.appendChild(div);
  });

  save();
}

function add(i){
  cart.push(products[i]);
  render();
}

function toggleFav(i){
  if(fav.includes(i)){
    fav = fav.filter(x => x !== i);
  } else {
    fav.push(i);
  }
  render();
}

function toggleCart(){
  let p = document.getElementById("panel");
  p.style.display = p.style.display === "block" ? "none" : "block";
}

render();
</script>

</body>
</html>
