<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SenetCCD</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#151f36;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#6d28d9;
  color:white;
}

.product{
  padding:10px;
  border-bottom:1px solid #333;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h2>Auth</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
    <button onclick="logout()">Logout</button>

    <p id="status">Not logged in</p>
    <p id="userInfo"></p>
  </div>

  <div class="card" id="adminPanel" style="display:none;">
    <h2>Admin</h2>

    <input id="p_name" placeholder="Name">
    <input id="p_desc" placeholder="Description">
    <input id="p_price" placeholder="Price">

    <button onclick="addProduct()">Add</button>
  </div>

  <div class="card">
    <h2>Products</h2>
    <div id="products"></div>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_EMAIL = "imanalyzh@gmail.com";

/* AUTH STATE */
auth.onAuthStateChanged(user => {

  if(user){
    status.innerText = "Logged in";
    userInfo.innerText = user.email;

    if(user.email === ADMIN_EMAIL){
      adminPanel.style.display = "block";
    }

  } else {
    status.innerText = "Not logged in";
    userInfo.innerText = "";
    adminPanel.style.display = "none";
  }

});

/* LOGIN */
function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(e => alert(e.message));
}

/* REGISTER */
function register(){
  auth.createUserWithEmailAndPassword(email.value,password.value)
  .catch(e => alert(e.message));
}

/* LOGOUT */
function logout(){
  auth.signOut();
}

/* ADD PRODUCT */
function addProduct(){
  db.collection("products").add({
    name:p_name.value,
    description:p_desc.value,
    price:p_price.value
  });
}

/* LOAD PRODUCTS */
db.collection("products").onSnapshot(snap=>{
  let html="";
  snap.forEach(doc=>{
    let p=doc.data();
    html+=`
      <div class="product">
        <b>${p.name}</b><br>
        ${p.description}<br>
        ${p.price} ₸
      </div>
    `;
  });
  products.innerHTML=html;
});

</script>

</body>
</html>
