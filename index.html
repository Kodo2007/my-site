<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SenetCCD Admin</title>

<style>
body{
  font-family: Arial;
  background:#0b1220;
  color:white;
  margin:0;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#151f36;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#6d28d9;
  color:white;
  cursor:pointer;
}

.product{
  padding:10px;
  border-bottom:1px solid #333;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h2>Auth</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>
    <button onclick="logout()">Logout</button>

    <p id="status">Not logged in</p>
    <p id="userInfo"></p>
  </div>

  <!-- ADMIN PANEL -->
  <div class="card" id="adminPanel" style="display:none;">
    <h2>🛠 Admin Panel</h2>

    <input id="p_name" placeholder="Product name">
    <input id="p_desc" placeholder="Description">
    <input id="p_price" placeholder="Price">
    <input id="p_img" placeholder="Image URL">

    <button onclick="addProduct()">Add Product</button>
  </div>

  <div class="card">
    <h2>Products</h2>
    <div id="products"></div>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

/* 🔥 CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* 👑 ТВОЙ EMAIL (АДМИН) */
const ADMIN_EMAIL = "imanalyzh@gmail.com";

/* AUTH STATE */
auth.onAuthStateChanged(user => {

  if(user){

    document.getElementById("status").innerText = "Logged in";
    document.getElementById("userInfo").innerText = user.email;

    if(user.email === ADMIN_EMAIL){
      document.getElementById("adminPanel").style.display = "block";
    }

  }else{

    document.getElementById("status").innerText = "Not logged in";
    document.getElementById("userInfo").innerText = "";
    document.getElementById("adminPanel").style.display = "none";

  }

});

/* REGISTER */
function register(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, password)
  .catch(e => alert(e.message));
}

/* LOGIN */
function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
  .catch(e => alert(e.message));
}

/* LOGOUT */
function logout(){
  auth.signOut();
}

/* ADD PRODUCT */
function addProduct(){

  const name = document.getElementById("p_name").value;
  const desc = document.getElementById("p_desc").value;
  const price = document.getElementById("p_price").value;
  const img = document.getElementById("p_img").value;

  db.collection("products").add({
    name,
    description: desc,
    price,
    image: img
  });

  alert("Added");

}

/* LOAD PRODUCTS */
db.collection("products").onSnapshot(snapshot => {

  let html = "";

  snapshot.forEach(doc => {

    let p = doc.data();

    html += `
      <div class="product">
        <b>${p.name}</b><br>
        ${p.description}<br>
        <b>${p.price} ₸</b>
      </div>
    `;

  });

  document.getElementById("products").innerHTML = html;

});

</script>

</body>
</html>
